specVersion: 1.0.0
description: sm-foundational Substreams-powered-Subgraph
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: substreams
    name: sm_foundational
    network: solana-mainnet-beta
    source:
      package:
        moduleName: map_block
        file: ../sm-foundational-v0.1.0.spkg
    mapping:
      apiVersion: 0.0.7
      kind: substreams/graph-entities
      file: ./src/mappings.ts
      handler: handleTriggers